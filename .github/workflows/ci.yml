name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test & vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          check-latest: true
          cache: true

      - name: go vet (root)
        run: go vet ./...

      - name: go test -race -cover (root)
        run: go test -race -cover ./...

      - name: go build (example)
        working-directory: examples/minimal
        run: go build ./...

      - name: go vet (example)
        working-directory: examples/minimal
        run: go vet ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - uses: golangci/golangci-lint-action@v8
        with:
          # Pin to a golangci-lint built with Go 1.25 so it can lint code
          # whose go.mod targets Go 1.25. alva-backend uses the v2.8.x
          # series via its reusable workflow; v2.8.0 matches local dev.
          version: v2.8.0
          args: --timeout=3m
