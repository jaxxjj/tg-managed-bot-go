name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test & vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          check-latest: true
          cache: true

      - name: go vet (root)
        run: go vet ./...

      - name: go test -race -cover (root)
        run: go test -race -cover ./...

      - name: go build (example)
        working-directory: examples/minimal
        run: go build ./...

      - name: go vet (example)
        working-directory: examples/minimal
        run: go vet ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=3m
